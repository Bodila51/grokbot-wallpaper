# Publishes the Grok Bot wallpaper with its demo data to GitHub Pages on every push to main:
# https://bodila51.github.io/grokbot-wallpaper/  (anyone can try it in the browser; installed wallpapers that point
# here pick up every change by themselves). Only the wallpaper's own files go out: no journal, keys or source art.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/face _site/assets/face _site/assets/blobs/thumbs _site/data
          cp web/face/index.html web/face/face.css web/face/face.js _site/face/
          cp assets/face/sphere.png assets/face/eye-*.png assets/face/eyes.json assets/face/grain.png _site/assets/face/
          cp assets/blobs/thumbs/*.png _site/assets/blobs/thumbs/
          cp web/data/demo-state.json web/data/demo-looks.json _site/data/
          printf '<!doctype html><meta charset="utf-8"><title>Grok Bot Wallpaper</title><meta http-equiv="refresh" content="0; url=face/"><a href="face/">Grok Bot Wallpaper</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
